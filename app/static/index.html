<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">Product Finder</a>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" maxlength="500" autocomplete="off"
             placeholder="Try “noise cancelling headphones for travel”" aria-label="Search products">
      <button type="submit">Search</button>
    </form>
  </header>

  <main id="app" aria-live="polite"></main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
